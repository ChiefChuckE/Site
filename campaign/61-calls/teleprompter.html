    <p class="sub">Tap <strong>Copy script</strong>, then paste into your teleprompter. You get the spoken words only, outro included. Nothing else.</p>
  </header>

<script>
const CALLS = [{"n": 1, "d": "Sun Nov 1", "t": "Nobody is built for this", "p": 1, "s": "Nobody is built for this job.\nI know. I was a CAL FIRE Deputy Chief.\nNow I live with a brain injury. And PTSD from the job.\n\nNot me. Not you. Not the toughest one on your crew.\nNot the soldier. Not the medic.\n\nWe see things the human brain was never meant to see.\nThen we go home and pass the potatoes like nothing happened.\n\nThat's not strength. That's a slow leak.\n\nFor 61 days, one video a day, I'm going to tell you what nobody told me.\nAbout PTSD. What it does to us. What actually helps.\n\nNo sugar coating.\n\nIf you wore the uniform, any uniform, or you love someone who did, stay.\n\nThis is Call 1 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 2, "d": "Mon Nov 2", "t": "It's an injury", "p": 1, "s": "If you broke your leg on a call, you'd get it set. Nobody would call you weak.\n\nPTSD is an injury too. You just can't see it on an X-ray.\n\nTrauma changes how your brain works.\nThe part that spots danger gets louder.\nThe part that says \"you're safe now\" gets quieter.\n\nThat's not a character flaw. That's biology.\n\nAnd here's what matters. Injuries heal. PTSD is treatable. People get better.\n\nBut only after you stop calling it weakness\nand start calling it what it is.\n\nAn injury. From the job.\n\nThis is Call 2 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 3, "d": "Tue Nov 3", "t": "It's the pile", "p": 1, "s": "Most people think PTSD comes from one horrible call. Sometimes it does.\n\nBut for a lot of us, it's the pile.\n\nThe kid. The rollover. The man nobody found for a week. The one you worked for forty minutes.\nYear after year after year.\n\nEvery one goes in the bag. You tell yourself you're fine.\nThe bag doesn't care.\n\nThe doctors who wrote the official rules for PTSD put us right in there.\nRepeated exposure to the worst details. They named first responders.\n\nSo if no single call broke you, that doesn't mean nothing's wrong.\n\nIt means the bag got full.\n\nThis is Call 3 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 4, "d": "Wed Nov 4", "t": "The alarm stuck on", "p": 1, "s": "Your brain has a smoke detector. It's called the amygdala.\n\nIts job is simple. Spot danger. Sound the alarm. Flood you with adrenaline.\nOn a call, that saves your life.\n\nTrauma can jam that detector in the ON position.\n\nNow it goes off in the grocery store. At your kid's game.\nAt two in the morning when nothing's happening.\n\nYour heart pounds. You scan every room. You snap at the people you love.\n\nYou're not crazy. Your alarm is stuck.\n\nAnd you don't fix an alarm by yelling at it.\nYou get it serviced.\n\nThat's what treatment does.\n\nThis is Call 4 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 5, "d": "Thu Nov 5", "t": "The four signs", "p": 1, "s": "Four signs. Learn them like your ABCs.\n\nOne. It comes back. Nightmares. Flashbacks. A smell that drops you right back on scene.\n\nTwo. You avoid. Certain streets. Certain calls. Talking about it at all.\n\nThree. Your mood and thinking change. Guilt. Numb. \"The world is rotten.\" You stop enjoying what you loved.\n\nFour. You're always on. Jumpy. Angry. Can't sleep. Back to the wall.\n\nIf those hang on for more than a month and get in the way of your life,\nthat's not \"just the job.\"\n\nThat's a reason to get checked.\n\nThis is Call 5 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 6, "d": "Fri Nov 6", "t": "It's not \"just a dream\"", "p": 1, "s": "\"It's just a bad dream.\" No, it isn't.\n\nI'll tell you straight. For me, the nightmares are the worst part.\nSome nights I wake up, and I'm right back there.\n\nWhen the same call plays at three a.m. Again. And again.\nThat's your brain trying to file something it can't file.\n\nFlashbacks too. You're awake, at the store,\nand for a second you're back on scene.\n\nThat's called intrusion. It's one of the core signs of PTSD.\n\nA lot of us handle it by not sleeping. Or drinking till we pass out.\nNeither works for long.\n\nNightmares are treatable. There are therapies built just for them.\nTell a doctor. Use the word \"nightmares.\" Out loud.\n\nThis is Call 6 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 7, "d": "Sat Nov 7", "t": "Avoidance looks like \"fine\"", "p": 1, "s": "The most dangerous symptom of PTSD looks like you're fine.\n\nIt's called avoidance.\n\nYou take the long way home so you don't pass that intersection.\nYou trade off certain calls. You change the channel.\nWhen someone asks, you say \"I'm good\" and change the subject.\n\nIt works. For a while.\n\nBut every time you avoid it, your brain learns the memory is still dangerous.\nThe fence gets taller. Your world gets smaller.\n\nAsk yourself one honest question today.\nWhat am I going out of my way not to think about?\n\nThat's where the work is.\n\nThis is Call 7 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 8, "d": "Sun Nov 8", "t": "Numb is not tough", "p": 1, "s": "Your kid hits a home run, and you feel nothing.\n\nSomeone you love says \"I love you,\" and you say it back on autopilot.\n\nWe call that tough. Steady.\n\nIt's not. It's numb.\n\nOn a call, shutting your feelings off is a tool. It lets you work.\nThe problem is, there's no switch that only turns off the bad ones.\n\nTurn off the horror, and you turn off the joy too.\n\nIf home feels flat. Gray. Far away.\nThat's a sign. Not of weakness. Of an injury that needs care.\n\nThe people at your table deserve the real you.\nSo do you.\n\nThis is Call 8 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 9, "d": "Mon Nov 9", "t": "Back to the wall", "p": 1, "s": "You walk into a restaurant. You pick the seat facing the door.\nYou clock the exits. You watch the guy by the counter.\n\nYou call it awareness. Everybody on the job does it.\n\nBut when you can't turn it off. At home. On vacation.\nIn bed at two a.m., listening for a noise.\nThat's hypervigilance. It's one of the signs of PTSD.\n\nYour body is burning fuel like it's on a call, twenty-four seven.\nNobody runs like that forever.\n\nIt shows up as exhaustion. A short fuse. A body that's always tight.\n\nBeing ready is the job.\nNever standing down is the injury.\n\nThis is Call 9 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 10, "d": "Tue Nov 10", "t": "Stress, burnout, PTSD", "p": 1, "s": "Stress. Burnout. PTSD. People use them like they're the same thing. They're not.\n\nStress is the weight. It goes up on a bad shift. It comes back down after.\n\nBurnout is running on empty. Tired. Cynical. You stop caring about the work.\n\nPTSD is tied to trauma. The memories come back. You avoid. You're always on edge.\nYour mood and thinking change.\nAnd it doesn't go away after a few days off.\n\nHere's the hard truth. You can have all three at once.\n\nAnd a vacation won't fix PTSD.\n\nKnow which one you're fighting. Then fight it with the right tool.\n\nThis is Call 10 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 11, "d": "Wed Nov 11", "t": "Two uniforms (Veterans Day)", "p": 1, "s": "Today is Veterans Day.\n\nA lot of us wore one uniform before we wore this one.\nMilitary first. Then the fire service. The badge. The ambulance.\n\nThat's two tours of trauma. One overseas. One on your own streets.\n\nAnd two cultures that said the same thing. Don't complain. Handle it.\n\nIf you're a vet who became a responder, you've been carrying a double load.\nThat's not a reason for shame. It's a reason to get help that understands both.\n\nVeterans, the VA treats PTSD. Crisis line: dial 988, then press 1.\n\nThank you for both of your services.\n\nThis is Call 11 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 12, "d": "Thu Nov 12", "t": "The smell", "p": 1, "s": "Ask any responder. Ask any vet. It's not always what you saw.\nIt's what you smelled.\n\nThere's a reason. Smell takes a shortcut straight to the parts of your brain that handle fear and memory.\n\nSo years later, a whiff of something. Burnt hair. Diesel. A certain cleaner.\nAnd you're back there. Heart racing. Before you even know why.\n\nThat's a trigger. It's not weakness. It's wiring.\n\nHere's one thing to try. When it hits, name it out loud.\n\"That's a trigger. I'm in my kitchen. It's Tuesday.\"\n\nNaming it tells your brain: not now. Not here.\n\nThis is Call 12 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 13, "d": "Fri Nov 13", "t": "Dispatchers", "p": 1, "s": "There's a responder who hears it all and never sees how it ends.\n\nThe dispatcher.\n\nThe mother screaming that her baby's not breathing.\nThe man who says goodbye before the line goes quiet.\n\nThey talk a stranger through CPR. Then the next call drops in.\nNo debrief. No ending. Next line.\n\nDispatchers get PTSD too. They're first responders,\neven when the paperwork doesn't say so.\n\nIf you've ever heard their voice in your ear on a call, thank them. Then check on them.\n\nDispatchers, every one of these 61 is for you too.\n\nThis is Call 13 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 14, "d": "Sat Nov 14", "t": "It shows up late", "p": 1, "s": "You might think, \"I got through my career fine. I'm out now.\"\n\nPTSD doesn't always show up on time.\n\nSometimes it hits years later. When you retire. When you get out.\nWhen the crew is gone and the radio's quiet.\nWhen there's no next call to keep you busy.\n\nEverything you outran for twenty, thirty years finally catches up.\n\nI know what it's like when the job ends and your brain doesn't get the memo.\n\nIf you're retired, or out of the service, and something's off, it counts.\nIt's still from the job. And it's still treatable.\n\nTomorrow, the signs your family sees before you do.\n\nThis is Call 14 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 15, "d": "Sun Nov 15", "t": "What your family sees", "p": 2, "s": "Your family saw it before you did.\n\nThe way you went quiet at dinner. The way a dropped pan made you jump.\nThe way you're home, but not really home.\n\nThey noticed you stopped laughing. They noticed the drinking.\nThey tiptoe around your moods and call it \"a long shift.\"\n\nYou think you're hiding it. You're not.\nYou're just the last one to know.\n\nSo tonight, ask the people you live with one question.\n\"Have I changed?\"\n\nThen don't argue. Don't explain. Just listen.\n\nTheir answer is the most honest test you'll ever take.\n\nThis is Call 15 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 16, "d": "Mon Nov 16", "t": "The drink after shift", "p": 2, "s": "One beer to come down. Then it's six.\n\nAfter a bad shift, you need to come down. A beer does it. Fast.\nThen it takes two. Then six. Then it's every night,\nand the morning is worse than the call.\n\nHere's what nobody tells you. Alcohol knocks you out, but it wrecks real sleep.\nAnd it makes the anxiety worse the next day. So you need it more.\n\nThat's not a party. That's self-medicating.\n\nWe're not drinking for fun. We're drinking to not feel.\n\nIf you can't go a week without it, that's your answer.\n\nTalk to someone. Before the bottle talks for you.\n\nThis is Call 16 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 17, "d": "Tue Nov 17", "t": "Anger first", "p": 2, "s": "For a lot of us, PTSD doesn't look like sad. It looks like mad.\n\nYou blow up at the kid for spilling milk.\nYou want to fight the guy who cut you off.\nYour crew walks on eggshells.\n\nHere's why. Your alarm is stuck on. Your body's ready to fight all day.\nAnd in our world, anger is the only feeling that's allowed.\nSo everything comes out as anger. Grief. Fear. Guilt. All of it.\n\nAnger isn't the problem. It's the smoke.\nThe fire is underneath.\n\nNext time you blow, ask yourself:\nWhat am I really feeling right now?\n\nThis is Call 17 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 18, "d": "Wed Nov 18", "t": "Sleep", "p": 2, "s": "Shift work breaks your sleep. Trauma finishes the job.\n\nTwenty-four on. Tones at two a.m. Watch rotations. Your body never knows what time it is.\n\nThen add PTSD. Your brain won't stand down.\nYou wake at three with your heart pounding.\nYou dread sleep because of what's waiting there.\n\nBad sleep makes everything worse. Anger. Memory. Pain. Drinking. Dark thoughts.\n\nAnd if you live with a brain injury like I do,\nsleep is when your brain does its repair work. No sleep, no repairs.\n\nSleep isn't a luxury. It's medical.\n\nTell your doctor you're not sleeping. And tell them why.\n\nThis is Call 18 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 19, "d": "Thu Nov 19", "t": "Your body is keeping count", "p": 2, "s": "Trauma doesn't just live in your head. It lives in your body.\n\nHeadaches. A gut that's always in knots.\nBack and neck pain that never lets go. Blood pressure through the roof.\n\nWhen your body stays in fight mode for years, it wears down.\nResearch links PTSD to a higher risk of heart disease.\n\nWe're good at ignoring our bodies. We worked hurt for years.\n\nStop. Get the physical.\nAnd tell the doctor what you've seen on the job. It's part of your medical history.\n\nIf you have chest pain, don't guess. Get it checked today.\n\nYour body has been keeping count. Let somebody read it.\n\nThis is Call 19 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 20, "d": "Fri Nov 20", "t": "The one who takes every shift", "p": 2, "s": "The one who never takes a day off might be running from something.\n\nEvery overtime shift. Every callback. First in, last out.\nWe call that a workhorse. Sometimes it is.\n\nAnd sometimes, staying busy is the only way not to think.\nBecause when it gets quiet, it all shows up.\n\nWork can be avoidance too. So can the gym seven days a week.\nSo can the garage at midnight.\n\nIf you're scared of a day off, ask yourself what's waiting in the quiet.\n\nAnd if you know a workhorse, ask how they're really doing.\nOn their day off.\n\nThis is Call 20 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 21, "d": "Sat Nov 21", "t": "The quiet one", "p": 2, "s": "The loudest warning sign is silence.\n\nHe used to give everybody grief at the kitchen table. Now he eats in the truck.\nShe used to come to every barbecue. Now there's always an excuse.\n\nWhen someone pulls away, we give them space. We think we're being respectful.\n\nSometimes space is the worst thing you can give.\n\nPulling away from people is a sign of PTSD. And depression.\nAnd it can come before a crisis.\n\nSo if someone's gone quiet, don't wait for them to come to you. They won't.\n\nGo to them. Sit down. Say,\n\"You've been quiet. I noticed. What's going on?\"\n\nThis is Call 21 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 22, "d": "Sun Nov 22", "t": "Living fast", "p": 2, "s": "A hundred and ten on the freeway isn't a hobby.\n\nNeither is the bar fight. The gambling. The affair. The bike with no helmet.\n\nAfter years of adrenaline, normal life feels flat.\nSo some of us go looking for the rush. Or we stop caring if we get hurt.\n\nReckless and self-destructive behavior is one of the official signs of PTSD.\n\nSometimes it's also a quiet way of saying,\n\"I don't care if I make it home.\"\n\nIf that's you, that matters. Tell someone.\n\nIf you see it in a buddy, don't laugh it off. Ask,\n\"Do you still care if you get hurt?\"\n\nThis is Call 22 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 23, "d": "Mon Nov 23", "t": "Kid calls", "p": 2, "s": "Ask any responder which calls they can't shake. It's the kids.\n\nThere's a reason. You can't make sense of it. Kids aren't supposed to die.\nAnd most of us go home to kids of our own.\n\nSo you see your son's face. Your daughter's shoes.\nAnd the call follows you right into their bedroom.\n\nVeterans know this too. The kids in a war zone. The ones you couldn't protect.\n\nIf a kid call is still with you years later, you're not soft. You're human.\n\nDon't carry it alone. Ask for a debrief after the next one.\nAnd if it's been years, it's not too late to talk about it.\n\nThis is Call 23 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 24, "d": "Tue Nov 24", "t": "Moral injury", "p": 2, "s": "Sometimes the wound isn't fear. It's \"I couldn't fix it.\"\n\nYou did everything right, and they died anyway.\nOr the system failed, and you had to go along with it.\nOr you made a call in two seconds that you've questioned for twenty years.\n\nThat's called moral injury. Guilt and shame, not just fear.\nVeterans and responders carry a lot of it.\n\nIt sounds like, \"I should have been faster.\" \"It's my fault.\" \"I'm not a good person.\"\n\nHere's the truth. You made life-and-death decisions with what you had, in seconds.\n\nHindsight is not a fair judge.\n\nMoral injury needs its own kind of help. Find someone who knows the term.\n\nThis is Call 24 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 25, "d": "Wed Nov 25", "t": "Brain injury or PTSD?", "p": 2, "s": "A brain injury and PTSD can look exactly alike. I would know. I live with both.\n\nTrouble remembering. Can't focus. Short fuse. Bad sleep. Headaches.\nNoise and bright lights feel like too much.\n\nThat list fits a brain injury. It also fits PTSD.\n\nAnd a lot of us have both. Responders take hits to the head. Veterans take blasts.\nMine came from COVID. My PTSD came from the job.\n\nHere's the danger. A doctor treats one and misses the other.\nOr you blame yourself for both.\n\nIf you've had a head injury or a serious illness, and you also carry trauma,\nask your doctor to look at both. By name.\n\nThat's what this channel is about. Different fire. Same fight.\n\nThis is Call 25 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 26, "d": "Thu Nov 26", "t": "The empty chair (Thanksgiving)", "p": 2, "s": "Somebody at your table today is there, but not there.\n\nThey're smiling. Passing the stuffing. Answering \"fine.\"\nAnd they're a thousand miles away.\n\nHolidays are hard for us. The noise. The crowd. The empty chair where someone used to sit.\n\nSo here's your job today.\n\nIf you're the one who's not really there, step outside for five minutes. Breathe. That's allowed.\n\nIf you're watching someone who's not really there, don't call them out at the table.\nFind them later. Just say, \"I'm glad you came.\"\n\nAnd never ask a responder or a vet, \"What's the worst thing you've seen?\"\nEver.\n\nThis is Call 26 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 27, "d": "Fri Nov 27", "t": "It comes home", "p": 2, "s": "Trauma doesn't stay at the station. It comes home with you.\n\nSpouses and kids of responders and veterans can start showing signs too.\nTrouble sleeping. Anxiety. Walking on eggshells.\nKids who are always watching your mood.\n\nIt's called secondary trauma. They didn't see the call.\nThey live with what it did to you.\n\nThis isn't about guilt. It's about the truth.\nWhen you get help, your whole house gets better.\n\nAnd spouses, your hurt counts too.\nYou can get support even if your responder won't.\nAsk the department, the union, or the VA about family support.\n\nThis is Call 27 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 28, "d": "Sat Nov 28", "t": "Five questions", "p": 2, "s": "Five yes-or-no questions. Be honest. Think about the past month.\n\nOne. Have you had nightmares about it, or thought about it when you didn't want to?\n\nTwo. Have you tried hard not to think about it, or gone out of your way to avoid reminders?\n\nThree. Have you been constantly on guard, watchful, or easily startled?\n\nFour. Have you felt numb, or cut off from people and things you used to enjoy?\n\nFive. Have you felt guilty, or unable to stop blaming yourself or others?\n\nThree or more yeses? That's not a diagnosis.\nIt's a reason to talk to a doctor. This week.\n\nThese come from the VA's own screening questions.\n\nThis is Call 28 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 29, "d": "Sun Nov 29", "t": "The number", "p": 3, "s": "More of us die by suicide than in the line of duty.\n\nHear that again.\n\nA 2018 study found police and firefighters were more likely to die by suicide than on the job.\nAnd veterans die by suicide at higher rates than people who never served.\n\nWe train for the fire. We train for the shooter. We train for the crash.\nAlmost nobody trains us for this.\n\nI'm not saying this to scare you. I'm saying it because the silence is what kills.\n\nSuicide is preventable. People who were at the edge are alive today\nbecause somebody asked. Somebody stayed. Somebody called.\n\nFor the next two weeks, I'm going to show you how to be that somebody.\n\nThis is Call 29 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 30, "d": "Mon Nov 30", "t": "\"Suck it up\"", "p": 3, "s": "The culture that made us good at the job is killing us.\n\nSuck it up. Rub some dirt on it. Leave it at the station. Embrace the suck.\n\nThat mindset works on scene. It gets the job done when everyone else is running away.\n\nBut we took a tool for the worst five minutes\nand made it the rule for the rest of our lives.\n\nAnd we pass it down. Every time a captain says \"toughen up.\"\nEvery time a crew laughs at the one who went to counseling.\n\nI heard those words my whole career.\n\nCulture changes one person at a time. It can start with you, next shift.\n\nTough is asking for help and going back to work.\n\nThis is Call 30 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 31, "d": "Tue Dec 1", "t": "The badge", "p": 3, "s": "We don't talk because we're scared they'll take the badge.\n\nOr the gun. The rig. The promotion. The clearance.\n\nThat fear is real. I'm not going to pretend it isn't.\n\nBut here's what I've seen. A lot more careers end because someone didn't get help.\nThe drinking catches up. The anger catches up.\nThe marriage. The DUI. The day they lose it on scene.\n\nGetting help early protects your career. Waiting is what puts it at risk.\n\nBefore you go, ask questions. Who sees my records? What gets reported?\nYour union and peer support can tell you. More on that in Call 41.\n\nThis is Call 31 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 32, "d": "Wed Dec 2", "t": "The joke", "p": 3, "s": "Dark humor keeps us sane. Until the joke isn't a joke.\n\nEvery crew has it. The gallows humor no civilian would understand.\nIt's how we breathe after the worst calls. I'm not against it.\n\nBut listen closer.\n\n\"If I don't wake up tomorrow, at least I won't have to work this shift.\"\n\"You can have my truck when I'm gone.\"\n\"Nobody'd notice anyway.\"\n\nSometimes that's a joke. Sometimes it's a test,\nto see if anyone will hear them.\n\nIf a joke about dying gives you a weird feeling in your gut, trust the gut.\n\nPull them aside. \"I heard what you said. Were you serious?\"\n\nThis is Call 32 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 33, "d": "Thu Dec 3", "t": "The marriage", "p": 3, "s": "The job doesn't just take your sleep. It can take your marriage.\n\nMissed birthdays. Missed holidays. Coming home and going silent.\nSnapping over nothing.\nSleeping in the recliner because the nightmares wake you both.\n\nYour spouse didn't sign up for a stranger. They signed up for you.\n\nPTSD builds a wall in the middle of the house.\nAnd most of us build it ourselves, one \"I'm fine\" at a time.\n\nHere's the hard part. You don't have to tell them about the call.\nYou do have to tell them you're struggling.\n\nThose are two different things.\n\nAnd couples counseling isn't failing. It's a fire break. It saves what's still standing.\n\nThis is Call 33 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 34, "d": "Fri Dec 4", "t": "Losing the crew", "p": 3, "s": "Retirement isn't losing a job. It's losing your family.\n\nFor twenty, thirty years, your crew was your people.\nYou ate together. Slept together. Bled together.\n\nThen one day there's a cake, a plaque, and it's over.\nThe phone stops ringing. The group text moves on.\n\nVeterans know this. Leaving the unit is leaving your tribe.\n\nThat's when a lot of us crash. No purpose. No crew.\nAnd everything we outran finally catches up.\n\nIf you're about to retire or get out, build a new crew before you leave.\n\nIf you're still in, call your retirees.\nThey'll act like it's no big deal. It's a big deal.\n\nThis is Call 34 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 35, "d": "Sat Dec 5", "t": "The warning signs", "p": 3, "s": "Learn these signs. Someone you know may be showing them right now.\n\nTalking about wanting to die, or being a burden.\nSaying there's no way out.\nPulling away from everyone.\nDrinking more. Driving reckless.\nGiving away things that matter.\nSaying goodbye like it's the last time.\n\nAnd watch for this one. A sudden calm, after a long dark stretch.\n\nThese don't mean someone is definitely in danger.\nThey mean you need to ask.\n\nTomorrow I'll show you exactly how.\n\nIf you're the one with these signs, reach out tonight.\n988. Responders, Safe Call Now. Vets, 988 then press 1.\n\nThis is Call 35 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 36, "d": "Sun Dec 6", "t": "Ask the question", "p": 3, "s": "Ask it out loud. \"Are you thinking about killing yourself?\"\n\nNot \"You're not thinking of doing anything stupid, are you?\"\nThat's asking for a \"no.\"\n\nAsk it straight.\n\nYou will not put the idea in their head. Research says asking doesn't raise the risk.\nIt often brings relief. Somebody finally saw them.\n\nIf they say yes, don't panic. Don't lecture. Stay with them.\n\nHelp them put time and distance between themselves and anything they could use to get hurt.\nOffer to hold their guns for a while.\n\nThen make the call together. 988. Or Safe Call Now.\n\nYou don't have to fix it. Ask. Stay. Connect.\n\nThis is Call 36 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 37, "d": "Mon Dec 7", "t": "What not to say", "p": 3, "s": "\"You've seen worse.\" Stop saying that.\n\nHere's what not to say to a responder or a vet who's struggling.\n\n\"You've seen worse.\"\n\"Just don't think about it.\"\n\"At least you made it home.\"\n\"You should be over it by now.\"\n\nEvery one of those says: shut up.\n\nHere's what works.\n\n\"That sounds heavy.\"\n\"I'm not going anywhere.\"\n\"Thanks for telling me.\"\n\"What do you need right now?\"\n\nYou don't need the perfect words.\nYou need to stay in the room.\n\nThis is Call 37 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 38, "d": "Tue Dec 8", "t": "What I got wrong as a chief", "p": 3, "s": "I was a chief. Here's what I got wrong.\n\nI thought if my people weren't talking, they were fine.\nI thought a debrief after the big ones was enough. It wasn't. It was the pile of small ones.\nI showed \"handle it\" every day. My crews watched me. So they did it too.\n\nChiefs. Captains. Sergeants. Here's what I'd do now.\n\nSay the word PTSD out loud at briefing.\nTell your people about your own hard calls.\nCheck on them a week after the bad one, not just that night.\n\nThey will follow you into a fire.\nThey'll follow you into help too.\n\nThis is Call 38 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 39, "d": "Wed Dec 9", "t": "Peer support", "p": 3, "s": "Sometimes the only person who can reach you is someone who's been there.\n\nThat's peer support. Trained responders and veterans who've walked the same road.\nThey're not therapists. They're the first door.\n\nThey know the calls. They know the culture. You don't have to translate.\n\nMost departments have a team now. If yours doesn't, try your union. Or a neighboring agency.\nVeterans can find peers through Vet Centers and veteran groups.\n\nPeer support can't fix everything. But it can walk you to the help that can.\n\nFind out who your peer support person is before you need one.\nPut their number in your phone. Today.\n\nThis is Call 39 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 40, "d": "Thu Dec 10", "t": "Help you already have", "p": 3, "s": "There's help you already have and probably never used.\n\nMost departments have an Employee Assistance Program. EAP.\nIt usually gives you a few free, confidential counseling sessions.\nOften your family can use it too.\n\nIs it perfect? No. Some EAP counselors don't get responders.\nIf yours doesn't, ask for one who does.\n\nVeterans, you may qualify for free counseling at a Vet Center.\nIt's confidential, and many of the counselors are vets themselves.\n\nYou earned this help. Using it isn't charity.\n\nFind your EAP number tonight. It's in your HR paperwork or on your department's website.\n\nThis is Call 40 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 41, "d": "Fri Dec 11", "t": "Will they find out?", "p": 3, "s": "\"If I get help, will my department find out?\" Ask the right questions first.\n\nIn general, your medical and counseling records are private.\nYour employer usually can't see them without your written permission.\n\nBut there are exceptions. Fitness-for-duty exams. Certain safety situations.\nRules that differ by state, agency, and contract.\n\nSo before your first session, ask the counselor:\n\"Who can see my records?\"\n\"What would you have to report?\"\n\"Will my employer get anything?\"\n\nAsk your union rep the same questions.\n\nKnowing the answers takes away the fear.\n\nThis is general information, not legal advice. Get the answers for your own situation.\n\nThis is Call 41 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 42, "d": "Sat Dec 12", "t": "The family left behind", "p": 3, "s": "The call doesn't end at the funeral.\n\nWhen one of us dies, by suicide or in the line of duty,\nthe pipes play, the flag gets folded, and everybody goes home.\n\nThe family is already home. And it's quiet.\n\nSpouses lose a partner. Kids lose a parent.\nCrews carry the guilt. \"Why didn't I see it?\"\n\nPeople who lose someone to suicide are at higher risk themselves.\nThat's not to scare you. It's so nobody gets left behind.\n\nIf you know a family who lost someone, call them.\nNot just this month. Next year. On the anniversary.\n\nThe crew doesn't stop being family when the shift ends.\n\nThis is Call 42 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 43, "d": "Sun Dec 13", "t": "It's treatable", "p": 4, "s": "Write this down. PTSD is treatable.\n\nNot just \"manageable.\" Treatable.\nMany people who get the right therapy get real relief.\nSome don't even meet the criteria for PTSD anymore.\n\nYou've heard forty-two calls of hard truth from me. Here's the best one.\nYou don't have to live like this forever.\n\nThe treatments that work best are talk therapies built for trauma.\nNot just venting. Real methods, with research behind them.\n\nOver the next few days, I'll break down the big three. In plain English.\n\nSo when you sit down with a counselor, you know what to ask for.\n\nThis is Call 43 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 44, "d": "Mon Dec 14", "t": "CPT", "p": 4, "s": "One therapy teaches you to argue with the lies trauma told you.\n\nIt's called Cognitive Processing Therapy. CPT.\n\nTrauma leaves beliefs behind. \"It was my fault.\" \"I can't trust anyone.\"\n\"Nowhere is safe.\"\n\nThose beliefs feel like facts. They're not.\n\nIn CPT, you and a therapist size up those thoughts, like you'd size up a scene.\nIs that true? What's the evidence?\nWhat would you tell a rookie who said that?\n\nIt's usually about twelve sessions. There's homework. It's work.\n\nAnd it's one of the most proven treatments for PTSD there is. The VA uses it every day.\n\nAsk for it by name. CPT.\n\nThis is Call 44 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 45, "d": "Tue Dec 15", "t": "Prolonged Exposure", "p": 4, "s": "The thing you avoid is the way out.\n\nProlonged Exposure therapy. PE.\n\nRemember avoidance, from Call 7? Every time you dodge the memory,\nyour brain thinks it's still dangerous.\n\nPE flips that. With a trained therapist, you slowly face the memory.\nYou tell it. Again and again.\nAnd you face the places you've been avoiding, one step at a time.\n\nIt sounds brutal. At first, it's hard.\n\nBut your brain learns, \"I can remember this, and I'm safe.\"\nAnd the alarm finally turns down.\n\nIt's one of the most studied PTSD treatments in the world.\n\nHard is not the same as harmful.\n\nThis is Call 45 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 46, "d": "Wed Dec 16", "t": "EMDR", "p": 4, "s": "It sounds weird. It has the research behind it.\n\nEMDR. Eye Movement Desensitization and Reprocessing.\n\nYou bring up the memory while doing back-and-forth movements.\nFollowing a light or a hand with your eyes. Or taps. Or tones.\n\nExperts still argue about why it works. But study after study says it does.\nThe VA and the World Health Organization both recommend it.\n\nA lot of responders and vets like it\nbecause you don't have to tell the whole story out loud, in detail.\n\nIf talking about it feels impossible, ask about EMDR.\n\nWeird is fine. Working is what counts.\n\nThis is Call 46 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 47, "d": "Thu Dec 17", "t": "Finding the right one", "p": 4, "s": "Your therapist shouldn't flinch at your stories.\n\nA lot of us try counseling once, get someone who goes pale at the first call we describe,\nand never go back.\n\nThat's not you failing. That's a bad fit.\n\nLook for someone who knows responders or veterans. Ask them straight.\n\n\"Have you worked with responders or vets?\"\n\"Do you do CPT, PE, or EMDR?\"\n\"Can you handle hearing what I've seen?\"\n\nPeer support, your union, and the VA can point you to people who get it.\n\nIt's okay to try a second one. Or a third.\n\nYou wouldn't keep a partner who froze on scene. Don't keep a therapist who does.\n\nThis is Call 47 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 48, "d": "Fri Dec 18", "t": "Medication", "p": 4, "s": "Taking medication isn't surrender. It's equipment.\n\nYou wear an air pack in smoke. A vest on patrol. Body armor downrange.\nNobody calls that weak.\n\nFor some people, medication helps turn down the alarm.\nSome help with the depression and anxiety that come with PTSD.\nDoctors also have medicines that can help with nightmares and sleep.\n\nIt's not for everyone. It's not magic. It works best alongside therapy.\n\nBe honest with the doctor. About the drinking. The sleep. The nightmares.\nThey need the full picture to pick the right tool.\n\nEquipment is not weakness. It's how we come home.\n\nThis is Call 48 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 49, "d": "Sat Dec 19", "t": "Sleep as a weapon", "p": 4, "s": "Fix the sleep and you fix half the fight.\n\nI told you nightmares are the worst part for me. So let's talk about sleep.\n\nThere's a therapy just for nightmares. Imagery Rehearsal Therapy.\nWhile you're awake, you rewrite the ending of the nightmare, and you practice the new one.\nFor a lot of people, the nightmares ease up.\n\nThere's a proven therapy for insomnia too. CBT-I. No pills required.\n\nThe basics help. Same wake-up time every day.\nNo booze to knock you out. Phone out of the bedroom. Dark, cool room.\n\nSleep isn't lazy. It's where your brain heals.\n\nProtect it like your life depends on it. It might.\n\nThis is Call 49 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 50, "d": "Sun Dec 20", "t": "Breathe", "p": 4, "s": "You already carry the best tool on the rig. Your breath.\n\nWhen the alarm goes off in your body, your breath is the one thing you can grab right now.\n\nTry this. Two breaths in through your nose. One normal, one more on top.\nThen one long, slow breath out through your mouth. Three times.\n\nThat long breath out tells your body to stand down.\n\nOr box breathing. In for four. Hold for four. Out for four. Hold for four.\nSoldiers and SWAT teams use it.\n\nIt won't fix PTSD. It'll get you through the next five minutes.\n\nSometimes the next five minutes is all you need.\n\nDo it with me. Right now.\n\n(Do the breaths now. Take your time.)\n\nThis is Call 50 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 51, "d": "Mon Dec 21", "t": "Move", "p": 4, "s": "Your body is built to burn off adrenaline. Let it.\n\nAdrenaline is fuel for a fight. When there's no fight, it just sits there.\nMaking you tight. Wired. Angry.\n\nExercise burns it off. Research shows regular exercise can ease PTSD symptoms,\ndepression, and anxiety. And it helps you sleep.\n\nYou don't need a fancy gym. Walk the dog. Lift in the garage.\nHit a heavy bag. Swim. Hike.\n\nTwenty or thirty minutes, most days.\n\nWith my brain injury, I have to go slower. That's fine. Slow still counts.\n\nAnd if you can, do it with somebody. Moving next to a buddy is half the therapy.\n\nThis is Call 51 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 52, "d": "Tue Dec 22", "t": "Know your rights", "p": 4, "s": "In some states, PTSD is presumed to come from the job. Know your law.\n\nIt's called a presumption. If you're covered, the law assumes your PTSD is job-related for workers' comp.\nCalifornia passed one in 2019 for firefighters and peace officers.\n\nNot every state has one. Some cover some jobs and not others.\nDispatchers and EMTs often get left out.\n\nVeterans, PTSD can be service-connected through the VA.\nA Veterans Service Officer can help you file. For free.\n\nDon't wait for a crisis to learn this.\n\nCall your union. Call a VSO. Ask, \"What am I covered for?\"\n\nYou were hurt on the job. That's not a favor. That's your right.\n\nThis is Call 52 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 53, "d": "Wed Dec 23", "t": "Talking to your kids", "p": 4, "s": "Your kids already know something's wrong.\n\nKids read a room better than any of us. They feel the tension. They see the anger.\nThey know when you're gone, even sitting on the couch.\n\nAnd when nobody explains it, kids fill in the blanks.\nUsually with, \"It's my fault.\"\n\nYou don't need to tell them about the calls. Keep it simple. Fit it to their age.\n\n\"My job hurt my brain. It's not your fault. I'm getting help. I love you.\"\n\nThat's it. That's enough.\n\nThen keep showing up. Board games. Rides to practice. Bedtime.\n\nYour kids don't need a perfect parent. They need one who's honest, and coming back.\n\nThis is Call 53 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 54, "d": "Thu Dec 24", "t": "Christmas Eve on shift", "p": 4, "s": "Somebody's working tonight. Call them.\n\nRight now there's a crew at a station eating a late dinner.\nA dispatcher watching the clock. A deputy alone in a patrol car.\nA nurse in the ER. A soldier a long way from home.\n\nHolidays are some of the hardest days on the job.\nAnd they're missing their own families to be there.\n\nTake ten seconds tonight. Text one of them.\n\"Thinking of you. Stay safe. Thank you.\"\n\nAnd if you're the one on shift, watching this between calls,\nI see you. I've worked those nights too.\n\nMerry Christmas. Come home safe.\n\nThis is Call 54 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 55, "d": "Fri Dec 25", "t": "The gift (Christmas)", "p": 5, "s": "The best gift you can give a responder or a veteran today costs nothing.\n\nA phone call.\n\nNot a text. A call. Hearing a voice matters.\n\nCall the retired guy who used to run your engine.\nCall your old platoon sergeant.\nCall the partner you lost touch with after the bad one.\n\nYou don't need a reason.\n\"Merry Christmas. I was thinking about you.\" That's the whole script.\n\nFor some people, that's the only call they'll get today.\n\nMake one call. Then come back and tell me who you called.\n\nThis is Call 55 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 56, "d": "Sat Dec 26", "t": "If it's you, tonight", "p": 5, "s": "If you're the one hurting, here's what to do tonight.\n\nOne. If you're thinking about suicide, call or text 988 right now.\nResponders, Safe Call Now. Vets, 988, then press 1.\nThey've heard it all. You won't shock them.\n\nTwo. Put time and distance between you and anything you could use to hurt yourself.\nHand your guns to someone you trust for a while.\n\nThree. Tell one person. Just one. \"I'm not okay.\"\n\nFour. Don't drink tonight. It makes the dark darker.\n\nFive. Tomorrow, call your doctor, your EAP, peer support, or the VA.\n\nYou've walked into burning buildings. You can walk into this.\n\nStay.\n\nThis is Call 56 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 57, "d": "Sun Dec 27", "t": "If you're the boss", "p": 5, "s": "If you lead a crew, here's what you do Monday.\n\nBring up PTSD at briefing. Out loud. Use the word.\n\nPost the numbers where everybody can see them.\nPeer support. EAP. 988. Safe Call Now.\n\nAfter a bad call, check in that night. And again a week later.\nThat second check is the one that matters.\n\nTell your people about your own hard calls. If you've gotten help, say so.\n\nIf someone gets mocked or punished for asking for help, shut it down. Hard.\n\nYour people watch what you do, not what you say.\n\nLead them into help the way you'd lead them into a fire. From the front.\n\nThis is Call 57 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 58, "d": "Mon Dec 28", "t": "If you love one of us", "p": 5, "s": "If you love a responder or a veteran, this one's for you.\n\nYou can't fix them. That's not your job.\n\nBut you can do this.\n\nLearn the signs. They've been on this channel for fifty-eight days.\nDon't push for the story. Push for the help.\nSay it plain. \"I love you. I'm worried. I want you to talk to someone.\"\nKeep the crisis numbers in your phone.\n\nAnd take care of yourself. Get your own support.\nYou can't pour from an empty cup.\n\nTo every spouse, parent, and kid holding the line at home.\nYou serve too. Thank you.\n\nThis is Call 58 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 59, "d": "Tue Dec 29", "t": "What recovery looks like", "p": 5, "s": "Recovery doesn't mean you forget.\n\nThe calls will always be part of you. That's not failure. That's your story.\n\nRecovery means the memory stops running your life.\n\nYou can drive past that intersection.\nYou sleep more nights than you don't.\nYou laugh at your kid's joke, and you feel it.\nA bad day is a bad day. Not a bad year.\n\nIt's not a straight line. There will be setbacks. That's normal.\n\nI still fight the nightmares. But I'm still here. I'm still fighting.\n\nBetter is real. I promise you.\n\nThis is Call 59 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 60, "d": "Wed Dec 30", "t": "My promise", "p": 5, "s": "Why I made these 61 videos.\n\nI was a CAL FIRE Deputy Chief. I led people into fires.\nI was supposed to be the steady one.\n\nThe job gave me PTSD. COVID gave me a brain injury.\nI lost my words for a while. They came back as poems.\n\nI could have stayed quiet. Most chiefs do.\n\nBut I believe this injury has a purpose. To lead again.\nNot into fires this time. Into the truth.\n\nSo here's my promise. I'm not going anywhere.\nI'll keep talking about this as long as I've got words.\n\nAnd if you need someone who gets it, I'm right here.\n\nThis is Call 60 of 61.\nSend it to someone who wore the uniform.\nDifferent fire. Same fight."}, {"n": 61, "d": "Thu Dec 31", "t": "Last call", "p": 5, "s": "This is the last call. Make one.\n\nFor 61 days I've told you the truth about PTSD.\nWhat it is. What it looks like. What it costs. What works.\n\nNow it's your turn.\n\nPick one person. A responder. A veteran. A spouse. Your old partner. Yourself.\n\nMake the call today. \"How are you really doing?\"\nOr, \"I'm not okay.\"\n\nThen send them this series. Start them at Call 1.\n\nThe campaign ends tonight. The fight doesn't.\n\nThis was Call 61 of 61.\nMake the call.\nDifferent fire. Same fight."}];

    const h = document.createElement('h2'); h.className = 'phase';
    h.innerHTML = '<span>Phase ' + c.p + '</span> · ' + NAMES[c.p];
    out.appendChild(h);
    list = document.createElement('div'); list.className = 'list'; out.appendChild(list);
  }
  const a = document.createElement('a'); a.href = '#call-' + c.n; a.textContent = c.n;
  if ([1,15,29,43,55].includes(c.n)) a.className = 'ph';
  jump.appendChild(a);
  const art = document.createElement('article'); art.className = 'call'; art.id = 'call-' + c.n;
  art.innerHTML = '<div class="head"><div class="num">' + String(c.n).padStart(2,'0') + '</div>' +
    '<div class="meta"><p class="title"></p><div class="date"></div></div>' +
    '<button class="copy" type="button" id="copy-' + c.n + '">Copy script</button></div>' +
    '<details><summary>Show script</summary><div class="script"></div></details>';
  art.querySelector('.title').textContent = c.t;
  art.querySelector('.date').textContent = c.d;
  const pre = art.querySelector('.script'); pre.textContent = c.s;
  const btn = art.querySelector('.copy');
  btn.addEventListener('click', () => {
    const ok = () => { btn.textContent = 'Copied'; btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Copy script'; btn.classList.remove('done'); }, 2000); };
    const fallback = () => { art.querySelector('details').open = true;
      const r = document.createRange(); r.selectNodeContents(pre);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = 'Selected. Tap Copy'; };
    try { navigator.clipboard.writeText(c.s).then(ok, fallback); } catch (e) { fallback(); }
  });
  list.appendChild(art);
}
function showHash(){ const id = location.hash.slice(1); const el = id && document.getElementById(id);
  if (el) { el.querySelector('details').open = true; el.scrollIntoView(); } }
addEventListener('hashchange', showHash); showHash();
</script>
